name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -r requirements.txt ruff==0.17.4
      - name: Lint (ruff, scope in ruff.toml)
        run: ruff check .
      - name: Layout check (required files, abstract, no public grade)
        run: python -m unittest tests.test_smoke -v
      - name: All tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Results regenerate from the code and seeds (floats within 1e-9 relative, tests/json_close.py)
        run: |
          python level-1-learn/run_learn.py
          python level-3-deep/rigor.py
          python level-3-deep/export_site_data.py
          python tests/json_close.py level-1-learn/results_learn.json level-3-deep/results_rigor.json site/src/generated/model.json site/src/generated/testset.json
      - name: Build and Deep run end to end (timing fields vary, so not diffed)
        run: |
          python level-2-build/run_build.py
          python level-3-deep/run_deep.py
